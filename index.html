<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f9f3ee"><title>君が生まれた日</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600&display=swap');
:root{--ink:#65554d;--soft:#8c7971;--rose:#c68c92;--line:#eadbd3}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:46px 18px;background:radial-gradient(circle at 12% 18%,#fce6e5 0,transparent 35%),radial-gradient(circle at 83% 88%,#f4e8ce 0,transparent 43%),#fbf7f2;color:var(--ink);font-family:'Noto Serif JP','Yu Mincho','Hiragino Mincho ProN',serif}.sparkle{position:fixed;color:#d7ac9b;font-size:20px;opacity:.55;pointer-events:none;animation:float 7s ease-in-out infinite}.s1{top:15%;left:14%}.s2{top:23%;right:13%;animation-delay:-3s}.s3{bottom:12%;left:20%;animation-delay:-5s}@keyframes float{50%{transform:translateY(-15px) rotate(20deg)}}.card{width:min(100%,570px);text-align:center;background:rgba(255,255,255,.78);border:1px solid #fff;outline:1px solid rgba(234,219,211,.6);outline-offset:7px;border-radius:5px;padding:52px 24px 43px;box-shadow:0 16px 45px rgba(119,83,70,.08)}.date{font:11px/1.8 system-ui,sans-serif;color:#bb9790;letter-spacing:.34em}.ornament{font-size:26px;color:#c9959e;margin:14px 0 17px}h1{font-weight:500;font-size:clamp(25px,6vw,37px);letter-spacing:.14em;margin:0 0 25px}.divider{width:44px;border:0;border-top:1px solid #d8bcb2;margin:0 auto 24px}.message{font-size:clamp(14px,3.65vw,17px);line-height:2.35;letter-spacing:.06em;margin:0 auto 33px}.message span{color:#ba8188}.vinyl{width:124px;height:124px;margin:0 auto 27px;border-radius:50%;background:repeating-radial-gradient(circle,#504743 0 2px,#594d49 3px 5px);box-shadow:0 8px 20px #6c5c512a;display:grid;place-items:center;position:relative;transition:transform .3s}.vinyl:after{content:'';position:absolute;width:9px;height:9px;background:#f7eadf;border-radius:50%}.label{width:53px;height:53px;border-radius:50%;display:grid;place-items:center;background:#d7aaa4;color:#fff4ee;font-size:18px}.vinyl.playing{animation:spin 4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}audio{width:min(100%,380px);height:48px;display:block;margin:auto;accent-color:#bc868b}.hint{font:11px system-ui,sans-serif;letter-spacing:.05em;color:#a59189;margin-top:15px}.footer{font:12px/1.8 system-ui,sans-serif;color:#ad9791;letter-spacing:.16em;margin-top:32px}.heart{color:#bf8990}@media(max-width:420px){.card{padding:40px 16px 35px}.message{line-height:2.2}}
</style></head><body><span class="sparkle s1">✧</span><span class="sparkle s2">✳</span><span class="sparkle s3">✧</span><main class="card"><div class="ornament">❀</div><h1>君が生まれた日</h1><hr class="divider"><p class="message">今まで何度も言われて<br>来たんだろうけど<br>僕が言うのはこれが最初<br><span>Happy birthday to you。</span></p><div class="vinyl" id="vinyl" aria-hidden="true"><div class="label">✿</div></div><audio id="song" controls preload="metadata" aria-label="君が生まれた日 音楽プレイヤー"><source src="song.m4a" type="audio/mp4">お使いのブラウザは音声の再生に対応していません。</audio></main><script>const audio=document.getElementById('song'),disc=document.getElementById('vinyl');audio.addEventListener('play',()=>disc.classList.add('playing'));['pause','ended'].forEach(e=>audio.addEventListener(e,()=>disc.classList.remove('playing')));</script></body></html>
